{% extends "base.html" %}
{% block title %}Bot {{ bot.id }} · Leadlane{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow"><a href="/">Bots</a> / Bot {{ bot.id }}</p>
    <h1>{{ profession_list(bot) }}</h1>
    <p class="lede">{{ bot.location }} · {{ source_label(bot.source) }}</p>

</header>
<div data-poll="/partials/bots/{{ bot.id }}">
  {% include "_bot_live.html" %}
</div>
{% endblock %}
