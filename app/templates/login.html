{% extends "base.html" %}
{% block title %}Sign in · Leadlane{% endblock %}
{% block bare %}
<section class="login-card">
  <p class="eyebrow">Leadlane</p>
  <h1>Sign in</h1>
  <p class="lede">This desk is for the account holder. Collection runs on the server, not on this computer.</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Enter</button>
  </form>
</section>
{% endblock %}
