services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadlane
      POSTGRES_PASSWORD: leadlane
      POSTGRES_DB: leadlane
    volumes:
      - leadlane-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadlane -d leadlane"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://leadlane:leadlane@db:5432/leadlane
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  leadlane-pg:
