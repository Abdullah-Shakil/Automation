name: Collect

# The dashboard stays on the owner's PC and does not collect.
# This job is the only collector. It is off until you opt in.
# Schedule runs only when the repository variable ENABLE_SCHEDULE is true.
# workflow_dispatch always works, so cron-job.org (or another free cron) can start a run
# without waiting for GitHub's scheduler.
# Public repositories: unlimited Actions minutes on standard runners.
# Private repositories: 2,000 minutes a month. The worker exits when nothing is due.
#
# Trade selection (All or one profession):
# - workflow_dispatch input "trade_preset" (cron-job.org can send it in the JSON body)
# - or repository variable TRADE_PRESET (used by the schedule and as dispatch default)
# - or the value saved from the Workers table on the dashboard (shared database)
on:
  workflow_dispatch:
    inputs:
      trade_preset:
        description: "What to find — all five trades, or one"
        required: false
        default: all
        type: choice
        options:
          - all
          - electrician
          - gardener
          - painter
          - plumber
          - solicitor
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: leadlane-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    # Secrets live in the Actions Environment named DATABASE_URL (repo Settings → Environments).
    environment: DATABASE_URL
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Require database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it under Settings → Environments → DATABASE_URL (or Repository secrets) and ensure this job uses environment: DATABASE_URL."
            exit 1
          fi
      - name: Collect
        run: python -m app.worker --max-seconds 480
        env:
          LEADLANE_CLOUD_WORKER: "1"
          # Prefer dispatch input; fall back to repo variable; blank keeps dashboard DB choice.
          TRADE_PRESET: ${{ github.event.inputs.trade_preset || vars.TRADE_PRESET || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
