name: Collect

# The dashboard stays on the owner's PC. This job is the collector.
# It runs every 3 hours, and also when started by hand.
# A private repository includes 2,000 GitHub Actions minutes a month.
# The worker exits when nothing is due, so an idle run stays short.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m app.worker --max-seconds 480
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          GOOGLE_PLACES_ENABLED: ${{ secrets.GOOGLE_PLACES_ENABLED }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DIRECTORY_SEARCH_URL_TEMPLATE: ${{ secrets.DIRECTORY_SEARCH_URL_TEMPLATE }}
